name: Desktop QA

on:
  push:
    branches: [main, feature/visualizer]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop QA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Test production file:// assets and actual IPC/BrowserWindow actions.
      - name: Production window controls
        env:
          NEOARES_QA_OUTPUT: ${{ runner.temp }}
        run: pnpm exec electron ${{ runner.os == 'Windows' && '--use-angle=swiftshader --enable-unsafe-swiftshader' || '' }} scripts/verify-full-player.cjs --packaged --window-actions-only
      # Windows CI uses SwiftShader explicitly; this tests rendering in a VM,
      # not a certification of every physical GPU/driver or OS resize gesture.
      - name: All bundled presets and real audio routing (Windows software GPU)
        if: runner.os == 'Windows'
        env:
          NEOARES_QA_OUTPUT: ${{ runner.temp }}
        run: pnpm exec electron --use-angle=swiftshader --enable-unsafe-swiftshader scripts/verify-visualizer.cjs
      - name: All bundled presets and real audio routing (macOS native GPU)
        if: runner.os == 'macOS'
        env:
          NEOARES_QA_OUTPUT: ${{ runner.temp }}
        run: pnpm exec electron scripts/verify-visualizer.cjs
      - name: Require complete result artifacts independently of Electron exit code
        env:
          NEOARES_QA_OUTPUT: ${{ runner.temp }}
        run: node scripts/verify-desktop-qa-results.cjs
      - name: Upload evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-qa-${{ matrix.os }}
          path: ${{ runner.temp }}/neoares-*/**
          if-no-files-found: warn
          retention-days: 14
